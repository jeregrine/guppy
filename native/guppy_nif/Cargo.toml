[package]
name = "guppy_nif"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "guppy_nif"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.98"
async-task = "4.7.1"
eetf = "0.11.0"
gpui = "0.2.2"
rustler = "0.37.4"
serde_json = "1.0.140"
unicode-segmentation = "1.12.0"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
