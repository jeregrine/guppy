name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  source-build:
    name: macOS source build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.0"
          elixir-version: "1.19.5"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Mix deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/guppy_nif/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/guppy_nif/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Run checks
        run: scripts/check

      - name: Clean install/load smoke test
        run: scripts/clean_install_load_test
